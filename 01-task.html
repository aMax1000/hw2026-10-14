<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 01</title>
</head>

<body>
    <button id="testBtn3" onclick="Func()">Test Button</button>
     <button id="testBtn1">Test Button</button>
     <button id="testBtn2">Test Button</button>
    <div id = "text"></div>
    <script>
        /*
        Задание:
        Добавьте для кнопки testBtn обработчик на событие click.
        Обработчик должен выводить на экран сообщение Hello world.
        Добавьте обработчик тремя разными способами.
        */
       let button1 = document.getElementById("testBtn1");
       let button2 = document.getElementById("testBtn2");
       button1.onclick = Func;
       button2.addEventListener("click",Func); // 3
       button2.addEventListener("click",Func2); 

        function Func()
        {
            let div = document.getElementById("text");
           // div.style.border = "1px solid red";
            div.style.backgroundColor = "Aqua";
            div.style.marginTop = "10px";
            div.style.width="100px";
            div.innerText = "Hello world";
        }
        function Func2()
        {
            let div = document.getElementById("text");
            div.style.border = "2px solid black";
            div.style.textAlign = "center";          
        }
    </script>
</body>

</html>
